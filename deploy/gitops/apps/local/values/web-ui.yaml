image:
  tag: "0.1.0"   # updated by CI on every merge to main

env:
  # nginx resolves this per request and ignores DNS search domains, so it must be the full name.
  CATALOG_URL: http://catalog-service.mediahub.svc.cluster.local

probes:
  startup:
    path: /healthz
  liveness:
    path: /healthz
  readiness:
    path: /healthz

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi

podAnnotations:
  prometheus.io/scrape: "false"   # static site: no metrics endpoint
