# Replaces the image's /etc/nginx/nginx.conf. Everything nginx writes at runtime (pid file, temp
# buffers, the rendered site config) goes to /tmp, so the container runs with a read-only root
# filesystem and as any non-root UID, matching the Helm chart's securityContext.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;   # don't advertise the nginx version in headers and error pages

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Rendered at startup from /etc/nginx/templates by the image's entrypoint (see Dockerfile).
    include /tmp/*.conf;
}
