spring:
  application:
    name: catalog-service
  threads:
    virtual:
      enabled: true
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/catalog}
  data:
    mongodb:
      auto-index-creation: true
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful

# Actuator on its own port so it is never routed through the public gateway.
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  observations:
    key-values:
      application: ${spring.application.name}

mediahub:
  security:
    # What Keycloak writes into tokens: the address the browser uses.
    issuer: ${OIDC_ISSUER:http://localhost:3000/auth/realms/mediahub}
    # Where to fetch Keycloak's public keys from, as seen from this service.
    jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/auth/realms/mediahub/protocol/openid-connect/certs}
    audience: mediahub-api

springdoc:
  swagger-ui:
    path: /swagger-ui.html
