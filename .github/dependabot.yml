version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ["org.springframework*", "io.spring*"]
  - package-ecosystem: docker
    directories: ["/services/*"]
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directories: ["/infra/terraform/envs/*"]
    schedule:
      interval: weekly
