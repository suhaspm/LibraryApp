# One pipeline for the whole monorepo. It works out which services changed, builds only those,
# and on main publishes signed multi-arch images and records the new tags in deploy/gitops.
# Argo CD notices that commit and rolls the change out: CI never touches a cluster (docs/adr/0004).
#
# Every third-party action is pinned to a full commit SHA. A tag can be moved to point at
# malicious code; a SHA cannot. Dependabot keeps the pins fresh (.github/dependabot.yml).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      infra: ${{ steps.detect.outputs.infra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: detect
        name: Detect changed services
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # First push to a new branch has no "before" commit: treat everything as changed.
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=$(git rev-list --max-parents=0 HEAD); fi
          changed=$(git diff --name-only "$base" HEAD)

          all=$(find services -mindepth 2 -maxdepth 2 -name Dockerfile | cut -d/ -f2 | sort)
          if echo "$changed" | grep -qE '^(build-logic/|gradle/|libs/|settings.gradle.kts|build.gradle.kts|\.github/workflows/ci.yml)'; then
            services="$all"          # shared build code changed: rebuild everything
          else
            services=$(echo "$changed" | grep '^services/' | cut -d/ -f2 | sort -u | grep -xF "$all" || true)
          fi
          echo "services=$(echo "$services" | jq -R . | jq -sc 'map(select(length > 0))')" >> "$GITHUB_OUTPUT"
          echo "infra=$(echo "$changed" | grep -qE '^(infra/|deploy/)' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Changed services: $(echo $services)"

  service:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GHCR
      id-token: write   # OIDC token for keyless cosign signing
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build and test (Testcontainers uses the runner's Docker)
        run: ./gradlew :services:${{ matrix.service }}:build --console=plain

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report-${{ matrix.service }}
          path: services/${{ matrix.service }}/build/reports/tests/

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/${{ matrix.service }}
          load: true
          tags: scan/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image for known vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: scan/${{ matrix.service }}:ci
          severity-cutoff: critical
          only-fixed: true   # fail only on criticals that actually have a fix available

      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.service }}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - id: push
        name: Build and push multi-arch image (amd64 laptops, arm64 Oracle VMs)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true                 # attach a software bill of materials
          provenance: mode=max       # and a record of how/where the image was built
          cache-from: type=gha,scope=${{ matrix.service }}

      - if: github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless, identity = this workflow)
        if: github.ref == 'refs/heads/main'
        run: cosign sign --yes "${REGISTRY}/${{ matrix.service }}@${{ steps.push.outputs.digest }}"

  helm:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Lint charts and render every environment
        run: |
          helm lint deploy/helm/microservice --set autoscaling.enabled=true --set podDisruptionBudget.enabled=true --set httpRoute.enabled=true
          for env in deploy/gitops/apps/*/; do
            helm lint deploy/gitops/root -f "$env/apps.yaml"
            for values in "$env"values/*.yaml; do
              helm template "$(basename "$values" .yaml)" deploy/helm/microservice -f "$values" > /dev/null
            done
          done

  terraform:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [local, github]
    defaults:
      run:
        working-directory: infra/terraform/envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - run: terraform fmt -check -recursive ../..
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: tflint --init && tflint --recursive --chdir=../..

  # Single required status check for branch protection: matrix job names change as services
  # are added, so the ruleset points at this job instead.
  ci-result:
    needs: [changes, service, helm, terraform]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        run: |
          echo '${{ toJson(needs) }}' | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'

  gitops:
    needs: [changes, service]
    if: github.ref == 'refs/heads/main' && needs.service.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: gitops-write   # one writer at a time; avoids two merges racing on the same file
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}   # deploy key = the only actor allowed to push to main
      - name: Record new image tags for Argo CD
        env:
          SERVICES: ${{ needs.changes.outputs.services }}
        run: |
          tag="${GITHUB_SHA::7}"
          for svc in $(echo "$SERVICES" | jq -r '.[]'); do
            for file in deploy/gitops/apps/local/values/"$svc".yaml; do
              [ -f "$file" ] && yq -i ".image.tag = \"$tag\"" "$file"
            done
          done
          git diff --quiet && { echo "Nothing to update"; exit 0; }
          git config user.name "mediahub-ci"
          git config user.email "ci@users.noreply.github.com"
          git commit -am "chore(gitops): deploy $(echo "$SERVICES" | jq -r 'join(", ")') at $tag"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
