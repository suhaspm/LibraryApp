apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secrets
type: Opaque
stringData:
  KC_BOOTSTRAP_ADMIN_PASSWORD: {{ .Values.keycloakAdminPassword | quote }}
  BFF_CLIENT_SECRET: {{ .Values.bffClientSecret | quote }}
  SERVICES_CLIENT_SECRET: {{ .Values.servicesClientSecret | quote }}
  MEMBER_PASSWORD: {{ .Values.memberPassword | quote }}
  LIBRARIAN_PASSWORD: {{ .Values.librarianPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secrets
type: Opaque
stringData:
  BFF_CLIENT_SECRET: {{ .Values.bffClientSecret | quote }}
  REDIS_PASSWORD: {{ .Values.valkeyPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: valkey-secrets
type: Opaque
stringData:
  VALKEY_PASSWORD: {{ .Values.valkeyPassword | quote }}
